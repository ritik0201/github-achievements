<!doctype html>
<html lang="en">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Student Exam Performance</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-3">Student Exam Performance</h3>
                        <p class="text-muted text-center small mb-4">Predict the student's maths score from demographics and practice scores.</p>

                        {% if results %}
                            <div class="alert alert-info text-center" role="alert">
                                Prediction: <strong>{{ results }}</strong>
                            </div>
                        {% endif %}

                        <form action="{{ url_for('predict_datapoint') }}" method="post">
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" name="gender" required>
                                        <option selected disabled value="">Choose...</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                    </select>
                                </div>

                                <div class="col-sm-6">
                                    <label class="form-label">Race / Ethnicity</label>
                                    <select class="form-select" name="ethnicity" required>
                                        <option selected disabled value="">Choose...</option>
                                        <option value="group A">Group A</option>
                                        <option value="group B">Group B</option>
                                        <option value="group C">Group C</option>
                                        <option value="group D">Group D</option>
                                        <option value="group E">Group E</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Parental Level of Education</label>
                                    <select class="form-select" name="parental_level_of_education" required>
                                        <option selected disabled value="">Choose...</option>
                                        <option value="associate's degree">associate's degree</option>
                                        <option value="bachelor's degree">bachelor's degree</option>
                                        <option value="high school">high school</option>
                                        <option value="master's degree">master's degree</option>
                                        <option value="some college">some college</option>
                                        <option value="some high school">some high school</option>
                                    </select>
                                </div>

                                <div class="col-sm-6">
                                    <label class="form-label">Lunch</label>
                                    <select class="form-select" name="lunch" required>
                                        <option selected disabled value="">Choose...</option>
                                        <option value="free/reduced">free/reduced</option>
                                        <option value="standard">standard</option>
                                    </select>
                                </div>

                                <div class="col-sm-6">
                                    <label class="form-label">Test Preparation</label>
                                    <select class="form-select" name="test_preparation_course" required>
                                        <option selected disabled value="">Choose...</option>
                                        <option value="none">None</option>
                                        <option value="completed">Completed</option>
                                    </select>
                                </div>

                                <div class="col-sm-6">
                                    <label class="form-label">Reading Score</label>
                                    <input class="form-control" type="number" name="reading_score" min="0" max="100" placeholder="0-100" required>
                                </div>

                                <div class="col-sm-6">
                                    <label class="form-label">Writing Score</label>
                                    <input class="form-control" type="number" name="writing_score" min="0" max="100" placeholder="0-100" required>
                                </div>

                                <div class="col-12 text-center mt-3">
                                    <button class="btn btn-primary btn-lg" type="submit">Predict Maths Score</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-center text-muted small mt-3">Tip: use realistic reading/writing scores for better predictions.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
